  # ─── orders ────────────────────────────────────────────────────────────────
  /orders:
    get:
      operationId: getOrders
      tags: [orders]
      summary: Listado de órdenes del panel, con filtros
      x-rol: Admin
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/query'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/EstadoOrden' } }
        - { name: deliveryMethod, in: query, schema: { $ref: '#/components/schemas/FormaDeEntrega' } }
        - { name: paymentMethod, in: query, schema: { $ref: '#/components/schemas/FormaDePago' } }
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: postOrders
      tags: [orders]
      summary: Crea la orden, descuenta el stock y suma las ventas (función SQL create_order, atómica)
      x-rol: Usuario
      security: [{ bearerAuth: [], turnstile: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OrdenEntrada' } } }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/client/{clientId}:
    get:
      operationId: getOrdersClientClientId
      tags: [orders]
      summary: Historial de pedidos de un cliente
      x-rol: Dueño o Admin
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: clientId, in: path, required: true, schema: { type: integer } }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200': { $ref: '#/components/responses/Paginated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /orders/{id}:
    get:
      operationId: getOrdersId
      tags: [orders]
      summary: Detalle de la orden con sus líneas y el cliente
      x-rol: Dueño o Admin
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{id}/status:
    patch:
      operationId: patchOrdersIdStatus
      tags: [orders]
      summary: Cambia el estado según la máquina de estados de la forma de entrega
      description: |
        Envío: Pendiente → Pagado → Enviado → Entregado.
        Retiro en sucursal: Pendiente → Pagado → Entregado.
        Cualquier estado no final puede pasar a Cancelado (devuelve el stock).
      x-rol: Admin
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { $ref: '#/components/schemas/EstadoOrden' } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{id}/delivery-method:
    patch:
      operationId: patchOrdersIdDeliveryMethod
      tags: [orders]
      summary: Cambia la forma de entrega
      x-rol: Admin
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deliveryMethod]
              properties: { deliveryMethod: { $ref: '#/components/schemas/FormaDeEntrega' } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
