<div
  class="rounded-full overflow-hidden border border-gray-200 flex items-center justify-center shrink-0 bg-indigo-100"
  [class]="containerClass()"
>
  @if (photoUrl() && !photoFailed()) {
    <img
      [src]="photoUrl()"
      [alt]="altText()"
      class="w-full h-full object-cover"
      (error)="photoFailed.set(true)"
    />
  } @else {
    <span class="font-bold text-brand">{{ initials() }}</span>
  }
</div>
