@if (show()) {
  <button
    type="button"
    (click)="toggleVisible()"
    aria-label="Mostrar contraseña"
    [attr.aria-pressed]="visible()"
    class="cursor-pointer text-gray-500 hover:text-brand focus:outline-hidden focus-visible:ring-2 focus-visible:ring-brand transition-colors flex items-center justify-center p-1 rounded-full"
  >
    @if (visible()) {
      <ng-icon name="bootstrapEye" class="block text-xl"></ng-icon>
    } @else {
      <ng-icon name="bootstrapEyeSlash" class="block text-xl"></ng-icon>
    }
  </button>
}
