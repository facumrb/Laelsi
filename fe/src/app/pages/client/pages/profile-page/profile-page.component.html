<div class="animate-fade-in mx-auto max-w-6xl relative page-container-adaptive">
  <div class="flex flex-col lg:flex-row gap-6">
    <!-- Menú de las pestañas: columna lateral en escritorio, arriba en celular -->
    <aside class="w-full lg:w-70 shrink-0">
      <div
        class="bg-white rounded-2xl shadow-sm border border-gray-200 p-3 relative z-30"
      >
        <div class="flex flex-col gap-2">
          <a
            [routerLink]="['/profile']"
            [routerLinkActiveOptions]="{ exact: true }"
            routerLinkActive="bg-violet-600/10 text-violet-700 shadow-sm border-violet-600/20 !cursor-default pointer-events-none"
            class="w-full text-left px-5 py-4 rounded-xl transition-all duration-200 font-bold flex items-center gap-4 border border-transparent text-gray-500 hover:bg-gray-50 hover:text-gray-800 cursor-pointer"
          >
            <ng-icon name="bootstrapFilePerson" class="text-2xl"></ng-icon>
            <span>Datos Personales</span>
          </a>

          <a
            [routerLink]="['/profile/user-data']"
            routerLinkActive="bg-violet-600/10 text-violet-700 shadow-sm border-violet-600/20 !cursor-default pointer-events-none"
            class="w-full text-left px-5 py-4 rounded-xl transition-all duration-200 font-bold flex items-center gap-4 border border-transparent text-gray-500 hover:bg-gray-50 hover:text-gray-800 cursor-pointer"
          >
            <ng-icon name="bootstrapShieldLock" class="text-2xl"></ng-icon>
            <span>Datos de Usuario</span>
          </a>

          <a
            [routerLink]="['/profile/orders']"
            routerLinkActive="bg-violet-600/10 text-violet-700 shadow-sm border-violet-600/20 !cursor-default pointer-events-none"
            class="w-full text-left px-5 py-4 rounded-xl transition-all duration-200 font-bold flex items-center gap-4 border border-transparent text-gray-500 hover:bg-gray-50 hover:text-gray-800 cursor-pointer"
          >
            <ng-icon name="bootstrapBoxSeam" class="text-2xl"></ng-icon>
            <span>Mis Pedidos</span>
          </a>
        </div>
      </div>
    </aside>

    <!-- Contenido de la pestaña activa -->
    <div class="flex-1 w-full lg:w-auto mt-2 lg:mt-0 lg:pl-4 min-w-0">
      @if (loading()) {
        <div
          class="flex justify-center items-center py-20 bg-white rounded-2xl border border-gray-200 shadow-sm min-h-100"
        >
          <div
            class="animate-spin rounded-full h-12 w-12 border-b-4 border-brand"
          ></div>
        </div>
      } @else if (profileError()) {
        <div
          role="alert"
          class="flex flex-col items-center justify-center gap-4 py-20 bg-white rounded-2xl border border-gray-200 shadow-sm min-h-100 text-center"
        >
          <p class="text-gray-600 font-medium">
            No pudimos cargar tu perfil.
          </p>
          <button
            type="button"
            (click)="retryProfile()"
            class="btn-primary cursor-pointer"
          >
            Reintentar
          </button>
        </div>
      } @else {
        <router-outlet (activate)="onActivate($event)" />
      }
    </div>
  </div>
</div>
