<div class="animate-fadeIn">
  <form [formGroup]="formUsuario" (ngSubmit)="onSubmit()" class="space-y-6">
    <div
      class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-neutral-200 relative group"
    >
      <div class="flex items-center gap-3 mb-8">
        <div
          class="w-12 h-12 rounded-2xl bg-blue-50 border border-blue-100 flex items-center justify-center text-blue-600"
        >
          <ng-icon name="bootstrapShieldLock" class="text-2xl"></ng-icon>
        </div>
        <div>
          <h1
            class="text-xl md:text-2xl font-bold text-gray-800 tracking-tight"
          >
            Datos de Autenticación
          </h1>
          <p class="text-xs md:text-sm font-medium text-gray-500">
            Gestiona tus credenciales de acceso
          </p>
        </div>
      </div>

      <!-- Foto de Perfil -->
      <div
        class="mb-10 p-6 bg-gray-50/50 rounded-2xl border border-gray-100 relative z-10 flex flex-col items-center justify-center text-center"
      >
        <h2
          class="text-sm font-bold text-gray-700 mb-4 tracking-wide uppercase"
        >
          Foto de Perfil
        </h2>
        <app-photo-manager
          [currentPhoto]="profile()?.photo || null"
          [userFullName]="
            (profile()?.name || '') + ' ' + (profile()?.lastName || '')
          "
        >
        </app-photo-manager>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-8 relative z-10">
        <div class="space-y-6">
          <div>
            <label
              for="username"
              class="block text-xs font-black text-gray-500 uppercase tracking-widest pl-1 mb-2 cursor-pointer"
              >Nombre de Usuario</label
            >
            <input
              type="text"
              id="username"
              name="username"
              formControlName="username"
              minlength="4"
              maxlength="30"
              placeholder="Ej: jperez"
              class="w-full p-3.5 bg-gray-50 border border-gray-200 text-gray-800 rounded-xl focus:ring-4 focus:ring-blue-500/20 focus:border-blue-500 focus:bg-white outline-none transition-all font-medium"
            />
            <app-field-error
              [control]="formUsuario.controls.username"
              validLabel="Usuario disponible"
            />
          </div>
        </div>

        <div
          class="space-y-6 bg-blue-50/30 p-4 sm:p-6 rounded-2xl border border-blue-50"
        >
          @if (!isChangePasswordMode()) {
            <div class="flex flex-col items-center justify-center py-4">
              <p class="text-sm font-medium text-blue-600 mb-4">
                ¿Deseas actualizar tu contraseña de acceso?
              </p>
              <button
                type="button"
                (click)="startPasswordChange()"
                class="px-6 py-2 bg-blue-600 text-white rounded-xl font-bold text-sm shadow-lg shadow-blue-500/30 hover:bg-blue-700 transition-all cursor-pointer"
              >
                Cambiar Contraseña
              </button>
            </div>
          } @else {
            <div class="animate-fadeIn">
              <div class="mb-6">
                <label
                  for="password"
                  class="block text-xs font-black text-blue-700 uppercase tracking-widest pl-1 mb-2 cursor-pointer"
                  >Nueva Contraseña</label
                >
                <div
                  class="password-field rounded-xl border border-blue-200 focus-within:ring-4 focus-within:ring-blue-500/20 focus-within:border-blue-500"
                >
                  <input
                    [type]="passwordVisible() ? 'text' : 'password'"
                    id="password"
                    name="password"
                    formControlName="password"
                    maxlength="100"
                    autocomplete="new-password"
                    aria-describedby="password-hint"
                    placeholder="Tu nueva contraseña"
                    class="password-field-input p-3.5 text-gray-800 font-medium placeholder-blue-300"
                  />

                  <app-password-toggle-button
                    [(visible)]="passwordVisible"
                    [show]="showEyeIcon()"
                  />
                </div>
                <p
                  id="password-hint"
                  class="mt-1 pl-1 text-xs font-medium"
                  [class.text-red-600]="passwordHintError()"
                  [class.text-blue-700]="!passwordHintError()"
                >
                  Mínimo 8 caracteres, al menos una letra y un número.
                </p>
              </div>

              <div>
                <label
                  for="confirmPassword"
                  class="block text-xs font-black text-blue-700 uppercase tracking-widest pl-1 mb-2 cursor-pointer"
                  >Confirmar Nueva Contraseña</label
                >
                <div
                  class="password-field rounded-xl border border-blue-200 focus-within:ring-4 focus-within:ring-blue-500/20 focus-within:border-blue-500"
                >
                  <input
                    [type]="confirmPasswordVisible() ? 'text' : 'password'"
                    id="confirmPassword"
                    name="confirmPassword"
                    formControlName="confirmPassword"
                    maxlength="100"
                    autocomplete="new-password"
                    placeholder="Repetí la contraseña"
                    class="password-field-input p-3.5 text-gray-800 font-medium placeholder-blue-300"
                  />

                  <app-password-toggle-button
                    [(visible)]="confirmPasswordVisible"
                    [show]="showConfirmEyeIcon()"
                  />
                </div>
                <app-field-error
                  [control]="formUsuario.controls.confirmPassword"
                />
              </div>
            </div>
          }
        </div>
      </div>
    </div>

    <div class="flex flex-wrap justify-end gap-3 pt-2">
      <button
        type="button"
        (click)="discardChanges()"
        [disabled]="saving() || !canDiscard()"
        class="bg-white text-gray-700 border border-gray-300 px-8 py-4 rounded-xl font-bold shadow-sm hover:bg-gray-50 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed active:scale-95 cursor-pointer"
      >
        Cancelar cambios
      </button>
      <button
        type="submit"
        [disabled]="saving() || !formUsuario.valid || !hasChanges()"
        class="bg-[#3d4494] text-white px-10 py-4 rounded-xl font-bold shadow-xl shadow-[#3d4494]/30 hover:bg-[#2d336b] hover:-translate-y-1 transition-all duration-300 disabled:opacity-50 disabled:hover:translate-y-0 disabled:cursor-not-allowed flex items-center gap-3 active:scale-95 cursor-pointer"
      >
        @if (saving()) {
          <span
            class="animate-spin rounded-full h-5 w-5 border-b-2 border-white"
          ></span>
          Actualizando...
        } @else {
          Actualizar Credenciales
        }
      </button>
    </div>
  </form>
</div>

@if (showVerifyModal()) {
  <app-verify-password-modal
    [username]="profile()?.username ?? ''"
    (verified)="onPasswordVerified($event)"
    (close)="showVerifyModal.set(false)"
  />
}
