<app-modal-shell
  title="Verificar identidad"
  size="md"
  [tintedHeader]="true"
  [busy]="verifying()"
  (close)="onClose()"
>
  <p modalSubtitle modalDescription>
    Para cambiar tu contraseña, primero confirmá la actual.
  </p>
  <form modalForm [formGroup]="form" novalidate (ngSubmit)="onSubmit()">
    <div class="modal-body">
      <input
        type="text"
        name="username"
        autocomplete="username"
        [value]="username()"
        readonly
        hidden
        tabindex="-1"
        aria-hidden="true"
      />

      <div>
        <label for="currentPassword" class="mb-1.5 form-label font-semibold">
          Contraseña actual
        </label>
        <app-password-input
          [control]="form.controls.password"
          inputId="currentPassword"
          [focusInitial]="true"
          placeholder=""
          autocomplete="current-password"
          describedBy="verify-password-error"
          fieldClass="rounded-lg border border-gray-300 shadow-sm focus-within:border-brand focus-within:ring-1 focus-within:ring-brand"
          inputClass="p-3 text-sm text-gray-900"
        />
        <p
          id="verify-password-error"
          role="alert"
          class="mt-1 min-h-5 text-xs text-red-600"
        >
          {{ errorMessage() }}
        </p>
      </div>
    </div>

    <div class="modal-footer">
      <button
        type="button"
        (click)="onClose()"
        [disabled]="verifying()"
        class="btn-secondary w-full sm:w-auto disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Cancelar
      </button>
      <button
        type="submit"
        [disabled]="verifying()"
        class="btn-primary flex w-full items-center justify-center gap-2 sm:w-auto"
      >
        @if (verifying()) {
          <span
            class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"
          ></span>
          Verificando...
        } @else {
          Verificar
        }
      </button>
    </div>
  </form>
</app-modal-shell>
