<div
  class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm z-110 flex items-center justify-center p-4 animate-fadeIn duration-200"
  (backdropClose)="onClose()"
>
  <div
    cdkTrapFocus
    cdkTrapFocusAutoCapture
    role="dialog"
    aria-modal="true"
    aria-labelledby="verify-password-title"
    aria-describedby="verify-password-description"
    class="bg-white rounded-2xl shadow-xl w-full max-w-lg animate-in zoom-in-95 duration-300 overflow-hidden flex flex-col max-h-[90vh]"
  >
    <header
      class="flex items-start justify-between gap-4 px-6 py-4 border-b border-gray-100 bg-gray-50/50 shrink-0"
    >
      <div>
        <h2 id="verify-password-title" class="text-lg font-bold text-gray-900">
          Verificar identidad
        </h2>
        <p
          id="verify-password-description"
          class="mt-0.5 text-sm font-medium text-gray-600"
        >
          Para cambiar tu contraseña, primero confirmá la actual.
        </p>
      </div>
      <app-close-modal-button (clicked)="onClose()" />
    </header>

    <form
      [formGroup]="form"
      novalidate
      (ngSubmit)="onSubmit()"
      class="flex flex-col min-h-0"
    >
      <div class="px-8 py-4 overflow-y-auto overscroll-contain">
        <input
          type="text"
          name="username"
          autocomplete="username"
          [value]="username()"
          readonly
          hidden
          tabindex="-1"
          aria-hidden="true"
        />

        <div>
          <label for="currentPassword" class="mb-1.5 form-label font-semibold">
            Contraseña actual
          </label>
          <div
            class="password-field rounded-lg border border-gray-300 shadow-sm focus-within:border-[#3d4494] focus-within:ring-1 focus-within:ring-[#3d4494]"
          >
            <input
              cdkFocusInitial
              [type]="passwordVisible() ? 'text' : 'password'"
              id="currentPassword"
              name="currentPassword"
              formControlName="password"
              maxlength="100"
              autocomplete="current-password"
              aria-describedby="verify-password-error"
              class="password-field-input p-3 text-sm text-gray-900"
            />

            <app-password-toggle-button
              [(visible)]="passwordVisible"
              [show]="showEyeIcon()"
            />
          </div>
          <p
            id="verify-password-error"
            role="alert"
            class="mt-1 min-h-5 text-xs text-red-600"
          >
            {{ errorMessage() }}
          </p>
        </div>
      </div>

      <footer
        class="flex flex-col-reverse sm:flex-row items-center justify-end gap-3 px-6 py-4 border-t border-gray-100 bg-gray-50/50 shrink-0"
      >
        <button
          type="button"
          (click)="onClose()"
          [disabled]="verifying()"
          class="w-full sm:w-auto btn-secondary disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="verifying()"
          class="w-full sm:w-auto btn-primary flex items-center justify-center gap-2"
        >
          @if (verifying()) {
            <span
              class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"
            ></span>
            Verificando...
          } @else {
            Verificar
          }
        </button>
      </footer>
    </form>
  </div>
</div>
