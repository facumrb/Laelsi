<div class="animate-fade-in container mx-auto p-4">
  <app-breadcrumbs [steps]="breadcrumbSteps()" />

  <header class="mb-4 border-b-2 border-accent-coral pb-4">
    <h1
      class="text-2xl sm:text-3xl font-black uppercase text-gray-900 wrap-break-word"
    >
      Resultados para:
      <span class="text-brand break-all">"{{ searchTerm() }}"</span>
    </h1>
  </header>

  <section aria-label="Filtros de búsqueda">
    <app-products-filter
      [(priceOrder)]="priceOrder"
      [(brandFilter)]="brandFilter"
      [(popularityOrder)]="popularityOrder"
      (priceOrderChange)="onFilterChange()"
      (brandFilterChange)="onFilterChange()"
      (popularityOrderChange)="onFilterChange()"
      [brands]="availableBrands()"
    />
  </section>

  <div class="product-grid" [attr.aria-busy]="loadingProducts()">
    @if (loadingProducts()) {
      <!-- Mientras cargan el esqueleto. El cartel de "no hay productos" solo aparece si de verdad no hay -->
      <p role="status" class="sr-only">Cargando productos…</p>
      @for (n of skeletonCards; track n) {
        <app-product-card-skeleton />
      }
    } @else {
      @for (product of products(); track product.id) {
        <app-product-card
          [product]="product"
          [prioritaria]="$index < tarjetasPrioritarias"
        />
      } @empty {
        <div class="col-span-full text-center py-12">
          <p class="text-gray-500 text-lg">
            No hay productos que coincidan con tus filtros.
          </p>
        </div>
      }
    }
  </div>

  <app-pagination
    [currentPage]="currentPage()"
    [totalPages]="totalPages()"
    (pageChange)="onPageChange($event)"
  />
</div>
