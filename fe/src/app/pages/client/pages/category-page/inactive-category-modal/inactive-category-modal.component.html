<app-modal-shell
  title="Categoría no disponible"
  icon="bootstrapExclamationTriangle"
  tone="warning"
  size="sm"
  [dismissible]="false"
>
  <p class="text-sm text-gray-600 leading-relaxed">
    Esta categoría se encuentra pausada o ya no está disponible en la tienda.
  </p>

  <button
    modalFooter
    type="button"
    class="btn-primary w-full sm:w-auto"
    (click)="closed.emit()"
  >
    Volver al inicio
  </button>
</app-modal-shell>
