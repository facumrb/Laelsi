<a [routerLink]="['/product', product().id]" class="elsi-product-card group">
  <app-product-image
    [imageUrl]="imageFileName()"
    [altText]="product().name"
    containerClass="w-full aspect-4/3 bg-gray-50"
    [loading]="prioritaria() ? 'eager' : 'lazy'"
    [priority]="prioritaria() ? 'high' : null"
  >
    @if (product().stock <= 0 || product().state === "Pausado") {
      <div
        class="absolute inset-0 bg-white/50 backdrop-blur-[1px] z-10 flex items-center justify-center pointer-events-none"
      >
        <app-product-status-badge
          [productState]="product().state"
          [categoryState]="product().category.state"
          [productStock]="product().stock"
          mode="overlay"
        />
      </div>
    }
  </app-product-image>

  <div class="p-3 sm:p-4 flex flex-col grow">
    <p class="elsi-brand-label">
      {{ product().brand || "Marca Genérica" }}
    </p>

    <h2
      class="text-base font-bold text-gray-800 leading-tight mb-2 line-clamp-2 transition-colors"
    >
      {{ product().name }}
    </h2>

    <div class="mt-auto pt-3 flex flex-col gap-3 border-t border-gray-50">
      <span class="text-lg sm:text-xl elsi-price truncate">
        {{ price() | currency: currency() : "symbol" : "1.0-0" }}
      </span>

      <app-add-to-cart-control
        [product]="product()"
        layout="compact"
        class="block -mx-1.5"
      />
    </div>
  </div>
</a>
