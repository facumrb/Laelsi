<div class="elsi-add-to-cart-container">
  @if (currentQuantity() === 0) {
    <!-- Boton de agregar inicial -->
    <button
      (click)="addInitial($event)"
      [disabled]="product().stock <= 0 || !canBuy()"
      [attr.aria-label]="
        canBuy() ? 'Sumar al carrito' : 'No disponible por ahora'
      "
      class="elsi-add-initial-btn"
      [class.btn-full]="layout() === 'full'"
      [class.@container]="layout() === 'compact'"
    >
      @if (layout() === "compact") {
        @if (canBuy()) {
          <span class="hidden @min-[8.5rem]:inline">Sumar al carrito</span>
          <span class="flex items-center gap-1.5 @min-[8.5rem]:hidden">
            <ng-icon name="bootstrapCart3" class="text-sm"></ng-icon>
            Sumar
          </span>
        } @else {
          No disponible
        }
      } @else {
        <span class="flex items-center gap-2">
          <ng-icon name="bootstrapPlusLg" class="text-lg"></ng-icon>
          {{ canBuy() ? "SUMAR AL CARRITO" : "NO DISPONIBLE POR AHORA" }}
        </span>
      }
    </button>
  } @else {
    <!-- Quantity Control "Pill" -->
    <div
      class="elsi-quantity-pill select-none"
      [class.pill-full]="layout() === 'full'"
    >
      <button
        (click)="decrement($event)"
        aria-label="Disminuir cantidad"
        class="pill-btn"
      >
        <ng-icon name="bootstrapDashLg"></ng-icon>
      </button>

      <span class="quantity-value font-bold">
        {{ currentQuantity() }}
      </span>

      <button
        (click)="increment($event)"
        [disabled]="!canIncrease()"
        aria-label="Aumentar cantidad"
        class="pill-btn"
      >
        <ng-icon name="bootstrapPlusLg"></ng-icon>
      </button>
    </div>
  }
</div>
