<div
  class="relative flex h-full flex-col overflow-hidden rounded-2xl border border-neutral-200 bg-white shadow-sm"
>
  <!-- Imagen: la misma proporción que la de la tarjeta real -->
  <div class="aspect-4/3 w-full animate-pulse bg-gray-100"></div>

  <div class="flex grow flex-col p-3 sm:p-4">
    <!-- Marca -->
    <div class="mb-1 h-4 w-1/3 animate-pulse rounded bg-gray-200"></div>

    <!-- Nombre: dos líneas, como el de la tarjeta real -->
    <div class="mb-2 flex h-10 flex-col justify-center gap-1.5">
      <div class="h-3.5 w-11/12 animate-pulse rounded bg-gray-200"></div>
      <div class="h-3.5 w-2/3 animate-pulse rounded bg-gray-200"></div>
    </div>

    <!-- Precio y botón de agregar -->
    <div
      class="mt-auto flex items-center justify-between gap-2 border-t border-gray-50 pt-3"
    >
      <div class="h-7 w-20 animate-pulse rounded bg-gray-200"></div>
      <div class="size-9 shrink-0 animate-pulse rounded-full bg-gray-200"></div>
    </div>
  </div>
</div>
