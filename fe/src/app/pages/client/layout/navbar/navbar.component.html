<header class="sticky top-0 z-(--z-header) bg-brand shadow-md [@media(max-height:480px)]:static">
  <app-navbar-top-bar
    [cartCount]="cartSignal()"
    [currentUser]="currentUser()"
    [isLoggedIn]="authService.isLoggedIn()"
    [isAdmin]="authService.isAdmin()"
    [menuOpen]="showSideMenu()"
    (menuToggled)="toggleMobileMenu()"
    (logoutRequested)="handleLogout()"
  />

  <app-navbar-category-bar
    [categories]="categories()"
    [activeCategoryIds]="activeCategoryIds()"
  />

  @defer (when showSideMenu(); prefetch on idle) {
    <app-navbar-mobile-sidebar
      [(isOpen)]="showSideMenu"
      [categories]="categories()"
      [activeCategoryIds]="activeCategoryIds()"
      [currentUser]="currentUser()"
      [isLoggedIn]="authService.isLoggedIn()"
      [isAdmin]="authService.isAdmin()"
      (logoutRequested)="handleLogout()"
    />
  }
</header>
