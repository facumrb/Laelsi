<td class="admin-table-cell-first">
  <div class="flex items-center gap-3">
    <div class="size-10 shrink-0 animate-pulse rounded-full bg-gray-200"></div>
    <div class="h-4 w-2/3 animate-pulse rounded bg-gray-200"></div>
  </div>
</td>

@for (column of middleColumns(); track column) {
  <td class="admin-table-cell">
    <div class="flex flex-col gap-2">
      <div class="h-3 w-1/3 animate-pulse rounded bg-gray-100 lg:hidden"></div>
      <div class="h-4 w-3/4 animate-pulse rounded bg-gray-200"></div>
    </div>
  </td>
}

<td class="admin-table-cell-last">
  <div class="flex items-center justify-start gap-2 lg:justify-center">
    <div class="size-8 animate-pulse rounded-md bg-gray-200"></div>
    <div class="size-8 animate-pulse rounded-md bg-gray-200"></div>
  </div>
</td>
