<div class="flex items-center justify-start lg:justify-center gap-3">
  <button
    type="button"
    (click)="onEdit.emit(item())"
    aria-label="Editar"
    class="cursor-pointer text-blue-600 hover:text-blue-900 transition-colors flex items-center justify-center"
    title="Editar"
  >
    <ng-icon name="bootstrapPencilSquare" class="text-xl"></ng-icon>
  </button>

  @if (canReactivate()) {
    <button
      type="button"
      (click)="onReactivate.emit(item())"
      aria-label="Reactivar"
      class="cursor-pointer text-emerald-600 hover:text-emerald-900 transition-colors flex items-center justify-center"
      title="Reactivar"
    >
      <ng-icon [name]="reactivateIcon()" class="text-xl"></ng-icon>
    </button>
  }

  @if (canDelete()) {
    <button
      type="button"
      (click)="onDelete.emit(item())"
      [attr.aria-label]="deleteLabel()"
      class="cursor-pointer text-red-600 hover:text-red-900 transition-colors flex items-center justify-center"
      [attr.title]="deleteLabel()"
    >
      <ng-icon [name]="deleteIcon()" class="text-xl"></ng-icon>
    </button>
  }
</div>
