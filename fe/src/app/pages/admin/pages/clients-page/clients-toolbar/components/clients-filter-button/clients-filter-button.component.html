<div
  class="relative col-span-1 lg:w-auto block"
  (clickOutside)="showFilterMenu.set(false)"
>
  <app-filter-button
    class="w-full block"
    [isActive]="hayFiltrosActivos()"
    [(isOpen)]="showFilterMenu"
  ></app-filter-button>

  @if (showFilterMenu()) {
    <div
      class="filter-panel top-full"
      role="region"
      aria-label="Opciones de filtro de clientes"
    >
      <div class="p-4 space-y-4">
        <app-filter-accordion
          label="Filtrar por Condición Fiscal"
          [options]="fiscalOptions"
          [(selected)]="fiscalFilter"
        ></app-filter-accordion>

        <hr class="border-gray-100" />

        <app-filter-accordion
          label="Filtrar por Estado"
          [options]="stateOptions"
          [(selected)]="stateFilter"
        ></app-filter-accordion>

        <button
          type="button"
          (click)="limpiar()"
          class="filter-reset-btn"
        >
          Limpiar todos los filtros
        </button>
      </div>
    </div>
  }
</div>
