<div class="animate-fadeIn container mx-auto">
  <app-clients-toolbar
    [(searchQuery)]="searchQuery"
    [(fiscalFilter)]="fiscalFilter"
    [(stateFilter)]="stateFilter"
    (onAdd)="handleNavigateToCreate()"
  />

  <app-clients-list
    class="mt-6 block"
    [clients]="clientsFiltered()"
    [isFilterActive]="filtersActive()"
    (onEdit)="handleNavigateToEdit($event)"
    (onDelete)="handleDelete($event)"
    (onReactivate)="reactivateClient($event)"
  />

  <app-pagination
    [currentPage]="currentPage()"
    [totalPages]="totalPages()"
    (pageChange)="onPageChange($event)"
  />

  @if (clientToDelete()) {
    <!-- Sin borrado permanente: solo se desactiva (ID 65 de discusiones.md) -->
    <app-confirm-delete-modal
      [entityName]="clientToDelete()!.name + ' ' + clientToDelete()!.lastName"
      entityType="cliente"
      [canDeactivate]="true"
      [allowPermanentDelete]="false"
      [isDeactivated]="clientToDelete()!.state === 'Inactivo'"
      (confirmDeactivate)="confirmDeactivateClient()"
      (close)="clientToDelete.set(null)"
    />
  }
</div>
