<div class="animate-fadeIn max-w-4xl mx-auto page-container-adaptive">
  <app-form-page-header
    class="mb-5"
    [title]="isEditMode() ? 'Editar Cliente' : 'Nuevo Cliente'"
    backUrl="/admin/clients"
  />

  <div class="form-card">
    <form [formGroup]="formClient" (ngSubmit)="onSubmit()" class="form-body">
      <div class="mb-2">
        <h2 class="form-section-title">Datos Personales</h2>

        <div class="form-grid-2">
          <div>
            <label for="name" class="form-label"> Nombre </label>
            <input
              type="text"
              id="name"
              name="name"
              formControlName="name"
              minlength="2"
              maxlength="100"
              class="form-input"
              placeholder="Ej: Juan"
            />
            <div class="min-h-8">
              <app-field-error [control]="formClient.controls.name" />
            </div>
          </div>

          <div>
            <label for="lastName" class="form-label"> Apellido </label>
            <input
              type="text"
              id="lastName"
              name="lastName"
              formControlName="lastName"
              minlength="2"
              maxlength="100"
              class="form-input"
              placeholder="Ej: Perez"
            />
            <div class="min-h-8">
              <app-field-error [control]="formClient.controls.lastName" />
            </div>
          </div>

          <div>
            <label for="dni" class="form-label"> DNI </label>
            <input
              type="text"
              id="dni"
              name="dni"
              formControlName="dni"
              minlength="7"
              maxlength="15"
              inputmode="numeric"
              appNumericInput
              class="form-input"
              placeholder="Ej: 12345678"
            />
            <div class="min-h-8">
              <app-field-error
                [control]="formClient.controls.dni"
                validLabel="DNI disponible"
              />
            </div>
          </div>

          <div>
            <label for="phone" class="form-label"> Teléfono </label>
            <input
              type="text"
              id="phone"
              name="phone"
              formControlName="phone"
              minlength="7"
              maxlength="20"
              inputmode="tel"
              appPhoneInput
              class="form-input"
              placeholder="Ej: 3415555555"
            />
            <div class="min-h-8">
              <app-field-error [control]="formClient.controls.phone" />
            </div>
          </div>
        </div>
      </div>

      <div class="mb-6">
        <h2 class="form-section-title">Cuenta de Usuario</h2>

        <div class="form-grid-2">
          <div>
            <label for="username" class="form-label">
              Nombre de Usuario <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              id="username"
              name="username"
              formControlName="username"
              minlength="4"
              maxlength="30"
              class="form-input"
              placeholder="Ej: jperez"
            />
            <div class="min-h-8">
              <app-field-error
                [control]="formClient.controls.username"
                validLabel="Usuario disponible"
              />
            </div>
          </div>

          <div>
            <label for="email" class="form-label">
              Email <span class="text-red-500">*</span>
            </label>
            <input
              type="email"
              id="email"
              name="email"
              formControlName="email"
              inputmode="email"
              maxlength="255"
              class="form-input"
              placeholder="Ej: juan@ejemplo.com"
            />
            <div class="min-h-8">
              <app-field-error
                [control]="formClient.controls.email"
                validLabel="Email disponible"
              />
            </div>
          </div>

          <div>
            <label for="password" class="form-label">
              Contraseña
              @if (!isEditMode()) {
                <span class="text-red-500">*</span>
              }
            </label>
            <app-password-input
              [control]="formClient.controls.password"
              inputId="password"
              describedBy="password-hint"
            />
            <app-password-rule-hint
              [control]="formClient.controls.password"
              [keepHint]="isEditMode()"
            />
          </div>

          <div>
            <label for="confirmPassword" class="form-label">
              Confirmar Contraseña
              @if (!isEditMode()) {
                <span class="text-red-500">*</span>
              }
            </label>
            <app-password-input
              [control]="formClient.controls.confirmPassword"
              inputId="confirmPassword"
              [placeholder]="
                isEditMode() ? 'Repetir nueva contraseña' : 'Repetir contraseña'
              "
            />
            <div class="min-h-8">
              <app-field-error
                [control]="formClient.controls.confirmPassword"
              />
            </div>
          </div>

          <div class="flex justify-center sm:justify-start pt-2 sm:col-span-2">
            <div class="w-full">
              <app-photo-manager
                [currentPhoto]="currentPhoto()"
                [userFullName]="fullName()"
              ></app-photo-manager>
            </div>
          </div>
        </div>
      </div>

      <div class="mb-3">
        <h2 class="form-section-title">Datos de Facturación</h2>

        <div class="form-grid-2">
          <app-fiscal-condition-select
            [control]="formClient.controls.fiscalCondition"
          />

          <div>
            <label for="cuit" class="form-label">
              CUIT / CUIL (11 números)
            </label>
            <input
              type="text"
              id="cuit"
              name="cuit"
              formControlName="cuit"
              minlength="11"
              maxlength="11"
              inputmode="numeric"
              appNumericInput
              class="form-input"
              placeholder="Ej: 20123456789"
            />
            <div class="min-h-8">
              <app-field-error
                [control]="formClient.controls.cuit"
                validLabel="CUIT disponible"
              />
            </div>
          </div>
        </div>
      </div>

      <div class="mb-6">
        <h2 class="form-section-title">Dirección</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-x-6 gap-y-3">
          <div class="md:col-span-2">
            <label for="street" class="form-label">Calle</label>
            <input
              type="text"
              id="street"
              name="street"
              formControlName="street"
              maxlength="100"
              class="form-input"
              placeholder="Ej: Av. San Martín"
            />
          </div>

          <div>
            <label for="streetNumber" class="form-label">Altura</label>
            <input
              type="text"
              id="streetNumber"
              name="streetNumber"
              formControlName="streetNumber"
              maxlength="10"
              inputmode="numeric"
              appNumericInput
              class="form-input"
              placeholder="Ej: 1234"
            />
          </div>

          <div>
            <label for="city" class="form-label">Ciudad</label>
            <input
              type="text"
              id="city"
              name="city"
              formControlName="city"
              maxlength="100"
              class="form-input"
              placeholder="Ej: Rosario"
            />
          </div>

          <div>
            <label for="province" class="form-label">Provincia</label>
            <input
              type="text"
              id="province"
              name="province"
              formControlName="province"
              maxlength="100"
              class="form-input"
              placeholder="Ej: Santa Fe"
            />
          </div>

          <div>
            <label for="postalCode" class="form-label">Código Postal</label>
            <input
              type="text"
              id="postalCode"
              name="postalCode"
              formControlName="postalCode"
              maxlength="10"
              inputmode="numeric"
              class="form-input"
              placeholder="Ej: 2000"
            />
          </div>

          <div>
            <label for="floor" class="form-label">Piso</label>
            <input
              type="text"
              id="floor"
              name="floor"
              formControlName="floor"
              maxlength="5"
              class="form-input"
              placeholder="Ej: 1"
            />
          </div>

          <div>
            <label for="apartment" class="form-label">Departamento</label>
            <input
              type="text"
              id="apartment"
              name="apartment"
              formControlName="apartment"
              maxlength="5"
              class="form-input"
              placeholder="Ej: B"
            />
          </div>
        </div>
      </div>

      @if (isEditMode()) {
        <app-audit-info
          [createdAt]="auditCreatedAt()"
          [updatedAt]="auditUpdatedAt()"
          [isActive]="true"
          [statusDate]="auditStatusDate()"
        />
      }

      <app-form-actions
        cancelUrl="/admin/clients"
        [submitLabel]="isEditMode() ? 'Guardar Cambios' : 'Crear Cliente'"
        [submitDisabled]="!formClient.valid || !hasRealChanges() || saving()"
      />
    </form>
  </div>
</div>
