<div class="animate-fade-in max-w-3xl mx-auto">
  <app-form-page-header
    class="mb-6"
    [title]="isEditMode() ? 'Editar Categoría' : 'Nueva Categoría'"
    [backUrl]="cancelUrl()"
  />

  <div class="form-card">
    <form [formGroup]="formCategory" (ngSubmit)="onSubmit()" class="form-body">
      <div class="grid grid-cols-1 gap-y-3">
        <div>
          <label for="name" class="form-label">
            Nombre de la categoría <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            id="name"
            name="name"
            formControlName="name"
            maxlength="50"
            placeholder="Ej: Electrónica, Ropa..."
            class="form-input"
          />
          <app-field-error
            [control]="formCategory.controls.name"
            [maxLength]="50"
            validLabel="Nombre disponible"
          />
        </div>

        <app-category-parent-select
          [control]="formCategory.controls.parentId"
          [categories]="allCategories()"
          [currentCategoryId]="categoryId()"
          [currentParentId]="currentParentId()"
        />

        <div>
          <label for="description" class="form-label"
            >Descripción (opcional)</label
          >
          <textarea
            id="description"
            name="description"
            formControlName="description"
            rows="4"
            placeholder="Breve descripción de la categoría..."
            maxlength="1000"
            class="form-input"
          ></textarea>
          <app-field-error
            [control]="formCategory.controls.description"
            [maxLength]="1000"
          />
        </div>

        <app-state-select
          [control]="formCategory.controls.state"
          [options]="stateOptions"
          triggerClass="focus:ring-1"
        />
      </div>

      @if (isEditMode()) {
        <app-audit-info
          [createdAt]="auditCreatedAt()"
          [updatedAt]="auditUpdatedAt()"
          [isActive]="initialState() === 'Activo'"
          [statusDate]="auditStatusDate()"
        />
      }

      <app-form-actions
        [cancelUrl]="cancelUrl()"
        submitClass=""
        [submitLabel]="isEditMode() ? 'Guardar Cambios' : 'Crear Categoría'"
        [submitDisabled]="!formCategory.valid || !hasRealChanges() || saving()"
      />
    </form>
  </div>
</div>
