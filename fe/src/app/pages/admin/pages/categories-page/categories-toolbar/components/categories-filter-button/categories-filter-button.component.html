<div class="relative w-full block" (clickOutside)="showFilterMenu.set(false)">
  <app-filter-button
    class="w-full block"
    [isActive]="hayFiltrosActivos()"
    [(isOpen)]="showFilterMenu"
  ></app-filter-button>

  @if (showFilterMenu()) {
    <div
      class="filter-panel top-full"
      role="region"
      aria-label="Opciones de filtro de categorías"
    >
      <div class="p-4 space-y-4">
        <app-filter-accordion
          label="Filtrar por Estado"
          [options]="statusOptions"
          [(selected)]="statusFilter"
        ></app-filter-accordion>

        <hr class="border-gray-100" />

        <app-filter-accordion
          label="Filtrar por Cantidad de Productos"
          [options]="stockOptions"
          [(selected)]="stockFilter"
        ></app-filter-accordion>

        <button
          type="button"
          (click)="limpiar()"
          class="filter-reset-btn"
        >
          Limpiar todos los filtros
        </button>
      </div>
    </div>
  }
</div>
