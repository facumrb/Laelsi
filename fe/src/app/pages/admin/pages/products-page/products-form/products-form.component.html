<div class="animate-fadeIn max-w-5xl mx-auto">
  <app-form-page-header
    class="mb-6"
    [title]="isEditMode() ? 'Editar Producto' : 'Nuevo Producto'"
    backUrl="/admin/products"
  />

  <div class="form-card">
    <form [formGroup]="formProduct" (ngSubmit)="onSubmit()" class="form-body">
      <div class="grid grid-cols-1 sm:grid-cols-6 gap-x-6 gap-y-2">
        <div class="sm:col-span-6">
          <label for="name" class="form-label">
            Nombre del Producto <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            id="name"
            name="name"
            formControlName="name"
            maxlength="50"
            class="form-input"
            placeholder="Ej: Auriculares Bluetooth Sony..."
          />
          <app-field-error
            [control]="formProduct.controls.name"
            [maxLength]="50"
            validLabel="Nombre disponible"
          />
        </div>

        <div class="sm:col-span-6">
          <label for="description" class="form-label">
            Descripción <span class="text-red-500">*</span>
          </label>
          <textarea
            id="description"
            name="description"
            formControlName="description"
            rows="5"
            maxlength="1000"
            class="form-input"
            placeholder="Describe las características principales..."
          ></textarea>
          <app-field-error
            [control]="formProduct.controls.description"
            [maxLength]="1000"
          />
        </div>

        <div class="sm:col-span-3 lg:col-span-2">
          <label for="brand" class="form-label">
            Marca <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            id="brand"
            name="brand"
            formControlName="brand"
            maxlength="100"
            class="form-input"
            placeholder="Ej: Samsung"
          />
          <app-field-error
            [control]="formProduct.controls.brand"
            [maxLength]="100"
          />
        </div>

        <app-state-select
          class="sm:col-span-3 lg:col-span-2"
          [control]="formProduct.controls.state"
          [options]="stateOptions"
          triggerClass="focus:border-gray-900 focus:ring-1 focus:ring-gray-900"
        />

        <div class="sm:col-span-6 lg:col-span-2">
          <app-product-category-select
            [control]="formProduct.controls.category"
            [categories]="categories()"
            (createCategory)="goToCreateCategory()"
          ></app-product-category-select>
        </div>

        <div class="sm:col-span-2">
          <label for="price" class="form-label">
            Precio <span class="text-red-500">*</span>
          </label>
          <div class="relative rounded-md shadow-sm">
            <div
              class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3"
            >
              <span class="text-gray-500 text-sm">$</span>
            </div>
            <input
              type="number"
              id="price"
              name="price"
              formControlName="price"
              placeholder="0"
              min="1"
              inputmode="decimal"
              appNumericInput
              class="form-input pl-7"
            />
          </div>
          <app-field-error [control]="formProduct.controls.price" />
        </div>

        <div class="sm:col-span-2">
          <label for="stock" class="form-label">
            Stock <span class="text-red-500">*</span>
          </label>
          <input
            type="number"
            id="stock"
            name="stock"
            formControlName="stock"
            placeholder="0"
            min="0"
            inputmode="numeric"
            appNumericInput
            class="form-input"
          />
          <app-field-error [control]="formProduct.controls.stock" />
        </div>

        <div class="sm:col-span-2">
          <label for="totalSold" class="form-label">
            Cantidad Vendida <span class="text-red-500">*</span>
          </label>
          <input
            type="number"
            id="totalSold"
            name="totalSold"
            formControlName="totalSold"
            placeholder="0"
            min="0"
            inputmode="numeric"
            appNumericInput
            class="form-input"
          />
          <app-field-error [control]="formProduct.controls.totalSold" />
        </div>

        <div class="sm:col-span-6 pt-4 border-t border-gray-100">
          <app-photo-manager [initialPhotos]="initialPhotos()" />
        </div>
      </div>

      @if (isEditMode()) {
        <app-audit-info
          [createdAt]="auditCreatedAt()"
          [updatedAt]="auditUpdatedAt()"
          [isActive]="initialState() === 'Activo'"
          [statusDate]="auditStatusDate()"
        />
      }

      <app-form-actions
        cancelUrl="/admin/products"
        submitClass=""
        [submitLabel]="isEditMode() ? 'Guardar Cambios' : 'Crear Producto'"
        [submitDisabled]="!formProduct.valid || !hasRealChanges() || saving()"
      />
    </form>
  </div>
</div>
