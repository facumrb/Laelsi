<div class="relative w-full" (clickOutside)="showCategoryMenu.set(false)">
  <label id="category-label" class="form-label"
    >Categoría <span class="text-red-500">*</span></label
  >

  <button
    type="button"
    (click)="toggleMenu()"
    aria-labelledby="category-label"
    [attr.aria-expanded]="showCategoryMenu()"
    aria-haspopup="listbox"
    class="select-trigger focus:border-gray-900 focus:ring-1 focus:ring-gray-900 w-full"
  >
    <span class="block truncate" [class.text-gray-500]="!control().value">
      {{ selectedCategoryName }}
    </span>
    <span class="select-chevron-wrapper">
      <ng-icon
        name="bootstrapChevronDown"
        class="text-sm text-gray-400 transition-transform duration-200"
        [class.rotate-180]="showCategoryMenu()"
      ></ng-icon>
    </span>
  </button>

  @if (showCategoryMenu()) {
    <div
      class="select-dropdown absolute z-20 mt-1 max-h-60 min-w-full w-max max-w-[min(28rem,calc(100vw-4rem))] overflow-auto rounded-md bg-white text-base shadow-lg ring-1 ring-black ring-opacity-5 focus:outline-none sm:text-sm animate-fadeIn"
    >
      <!-- Solo las opciones van dentro de la lista; el botón "Nueva Categoría" queda afuera -->
      <div
        appListbox
        aria-labelledby="category-label"
        (closed)="showCategoryMenu.set(false)"
      >
        @for (cat of hierarchicalCategories(); track cat.id) {
          <div
            role="option"
            tabindex="-1"
            [attr.aria-selected]="control().value?.id === cat.id"
            (click)="selectCategory(cat)"
            class="relative cursor-pointer select-none py-2 pr-9 text-gray-900 hover:bg-gray-100 transition-colors"
            [style.padding-left.rem]="0.75 + cat.depth * 1"
            [class.font-bold]="cat.depth === 0"
            [class.font-normal]="cat.depth > 0"
          >
            <div class="flex items-center gap-2">
              @if (cat.depth > 0) {
                <span class="text-gray-300">↳</span>
              }
              <span
                class="block wrap-break-word"
                [class.text-[#3d4494]]="control().value?.id === cat.id"
              >
                {{ cat.name }}
              </span>
            </div>

            @if (control().value?.id === cat.id) {
              <span
                class="absolute inset-y-0 right-0 flex items-center pr-4 text-[#3d4494]"
              >
                <ng-icon name="bootstrapCheckLg" class="text-lg"></ng-icon>
              </span>
            }
          </div>
        }
      </div>

      @if (hierarchicalCategories().length === 0) {
        <div
          class="relative cursor-default select-none py-2 pl-3 pr-9 text-gray-500"
        >
          No hay categorías disponibles
        </div>
      }

      <div class="border-t border-dashed border-gray-300">
        <button
          type="button"
          (click)="createCategory.emit()"
          class="cursor-pointer flex w-full items-center gap-2 px-3 py-2 text-sm font-bold text-[#3d4494] hover:bg-blue-50 transition-colors"
        >
          <ng-icon name="bootstrapPlusLg"></ng-icon>
          Nueva Categoría
        </button>
      </div>
    </div>
  }

  <app-field-error [control]="control()" />
</div>
