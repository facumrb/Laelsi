<div class="animate-fadeIn max-w-4xl mx-auto page-container-adaptive">
  <app-form-page-header
    class="mb-5"
    [title]="isEditMode() ? 'Editar Administrador' : 'Nuevo Administrador'"
    backUrl="/admin/admins"
  />

  <div class="form-card">
    <form [formGroup]="formAdmin" (ngSubmit)="onSubmit()" class="form-body">
      <div class="mb-2">
        <h2 class="form-section-title">Datos Personales</h2>

        <div class="form-grid-2">
          <div>
            <label for="name" class="form-label">
              Nombre <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              id="name"
              name="name"
              formControlName="name"
              minlength="2"
              maxlength="100"
              class="form-input"
              placeholder="Ej: Juan"
            />
            <div class="min-h-8">
              <app-field-error [control]="formAdmin.controls.name" />
            </div>
          </div>

          <div>
            <label for="lastName" class="form-label">
              Apellido <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              id="lastName"
              name="lastName"
              formControlName="lastName"
              minlength="2"
              maxlength="100"
              class="form-input"
              placeholder="Ej: Perez"
            />
            <div class="min-h-8">
              <app-field-error [control]="formAdmin.controls.lastName" />
            </div>
          </div>

          <div>
            <label for="dni" class="form-label">
              DNI <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              id="dni"
              name="dni"
              formControlName="dni"
              minlength="7"
              maxlength="15"
              inputmode="numeric"
              appNumericInput
              class="form-input"
              placeholder="Ej: 12345678"
            />
            <div class="min-h-8">
              <app-field-error
                [control]="formAdmin.controls.dni"
                validLabel="DNI disponible"
              />
            </div>
          </div>

          <div>
            <label for="phone" class="form-label">
              Teléfono <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              id="phone"
              name="phone"
              formControlName="phone"
              minlength="7"
              maxlength="20"
              inputmode="tel"
              appPhoneInput
              class="form-input"
              placeholder="Ej: 3415555555"
            />
            <div class="min-h-8">
              <app-field-error [control]="formAdmin.controls.phone" />
            </div>
          </div>
        </div>
      </div>

      <div class="mb-6">
        <h2 class="form-section-title">Cuenta de Usuario</h2>

        <div class="form-grid-2">
          <div>
            <label for="username" class="form-label">
              Nombre de Usuario <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              id="username"
              name="username"
              formControlName="username"
              minlength="4"
              maxlength="30"
              class="form-input"
              placeholder="Ej: jperez"
            />
            <div class="min-h-8">
              <app-field-error
                [control]="formAdmin.controls.username"
                validLabel="Usuario disponible"
              />
            </div>
          </div>

          <div>
            <label for="email" class="form-label">
              Email <span class="text-red-500">*</span>
            </label>
            <input
              type="email"
              id="email"
              name="email"
              formControlName="email"
              inputmode="email"
              maxlength="255"
              class="form-input"
              placeholder="Ej: juan@ejemplo.com"
            />
            <div class="min-h-8">
              <app-field-error
                [control]="formAdmin.controls.email"
                validLabel="Email disponible"
              />
            </div>
          </div>

          <div>
            <label for="password" class="form-label">
              Contraseña
              @if (!isEditMode()) {
                <span class="text-red-500">*</span>
              }
            </label>
            <app-password-input
              [control]="formAdmin.controls.password"
              inputId="password"
              describedBy="password-hint"
            />
            <app-password-rule-hint
              [control]="formAdmin.controls.password"
              [keepHint]="isEditMode()"
            />
          </div>

          <div>
            <label for="confirmPassword" class="form-label">
              Confirmar Contraseña
              @if (!isEditMode()) {
                <span class="text-red-500">*</span>
              }
            </label>
            <app-password-input
              [control]="formAdmin.controls.confirmPassword"
              inputId="confirmPassword"
              [placeholder]="
                isEditMode() ? 'Repetir nueva contraseña' : 'Repetir contraseña'
              "
            />
            <div class="min-h-8">
              <app-field-error [control]="formAdmin.controls.confirmPassword" />
            </div>
          </div>

          <div class="flex justify-center sm:justify-start pt-2 sm:col-span-2">
            <div class="w-full">
              <app-photo-manager
                [currentPhoto]="currentPhoto()"
                [userFullName]="fullName()"
              ></app-photo-manager>
            </div>
          </div>
        </div>
      </div>

      @if (isEditMode()) {
        <app-audit-info
          [createdAt]="auditCreatedAt()"
          [updatedAt]="auditUpdatedAt()"
          [isActive]="true"
          [statusDate]="auditStatusDate()"
        />
      }

      <app-form-actions
        cancelUrl="/admin/admins"
        [submitLabel]="isEditMode() ? 'Guardar Cambios' : 'Crear Administrador'"
        [submitDisabled]="!formAdmin.valid || !hasRealChanges() || saving()"
      />
    </form>
  </div>
</div>
