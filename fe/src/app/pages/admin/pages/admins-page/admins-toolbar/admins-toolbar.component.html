<div class="toolbar-container">
  <app-toolbar-title title="Administradores"></app-toolbar-title>

  <div class="flex flex-col lg:flex-row gap-3 w-full lg:w-auto">
    <div class="w-full lg:w-48 xl:w-72">
      <app-search-input [(query)]="searchQuery" placeholder="Buscar administrador..."></app-search-input>
    </div>

    <div class="grid grid-cols-2 gap-3 w-full lg:flex lg:w-auto">
      <app-admins-filter-button
        [(stateFilter)]="stateFilter"
      ></app-admins-filter-button>

      <div class="col-span-1 lg:w-auto">
        <app-create-entity-button
          class="w-full lg:w-auto"
          label="Administrador"
          (clicked)="onAdd.emit()"
        ></app-create-entity-button>
      </div>
    </div>
  </div>
</div>
