<div class="animate-fadeIn container mx-auto">
  <app-admins-toolbar
    [(searchQuery)]="searchQuery"
    [(stateFilter)]="stateFilter"
    (onAdd)="handleNavigateToCreate()"
  />

  <app-admins-list
    class="mt-6 block"
    [admins]="adminsFiltered()"
    [isFilterActive]="filtersActive()"
    (onEdit)="handleNavigateToEdit($event)"
    (onDelete)="handleDelete($event)"
    (onReactivate)="reactivateAdmin($event)"
  />

  <app-pagination
    [currentPage]="currentPage()"
    [totalPages]="totalPages()"
    (pageChange)="onPageChange($event)"
  />

  @if (adminToDelete()) {
    <!-- Sin borrado permanente: solo se desactiva (ID 65 de discusiones.md) -->
    <app-confirm-delete-modal
      [entityName]="adminToDelete()!.name + ' ' + adminToDelete()!.lastName"
      entityType="administrador"
      [canDeactivate]="true"
      [allowPermanentDelete]="false"
      [isDeactivated]="adminToDelete()!.state === 'Inactivo'"
      (confirmDeactivate)="confirmDeactivateAdmin()"
      (close)="adminToDelete.set(null)"
    />
  }

  @if (showSelfDeleteBlockedModal()) {
    <app-admin-self-delete-blocked-modal
      (close)="showSelfDeleteBlockedModal.set(false)"
    />
  }
</div>
