<app-auth-shell
  layout="stacked"
  heading="Crear cuenta - LaElsi"
  backUrl="/auth/login"
>
  <form
    [formGroup]="formRegister"
    novalidate
    (ngSubmit)="onSubmit()"
    class="space-y-4"
  >
    <!-- Grilla por columnas: en móvil el orden es Usuario, Email, Contraseña, Confirmar; desde sm cada fila se alinea entre columnas -->
    <div
      class="grid grid-cols-1 gap-y-3 sm:grid-cols-2 sm:grid-flow-col sm:grid-rows-2 sm:gap-y-5 sm:gap-x-6 lg:gap-x-12"
    >
      <div>
        <label for="username" class="mb-1.5 form-label font-semibold">
          Nombre de usuario <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          id="username"
          name="username"
          formControlName="username"
          minlength="4"
          maxlength="30"
          autocomplete="username"
          class="form-input p-3 focus:border-brand focus:ring-1 focus:ring-brand outline-hidden transition-all"
          placeholder="Ej: jperez"
        />
        <div class="min-h-8">
          <app-field-error
            [control]="formRegister.controls.username"
            [maxLength]="30"
            validLabel="Usuario disponible"
          />
        </div>
      </div>

      <div>
        <label for="email" class="mb-1.5 form-label font-semibold">
          Email <span class="text-red-500">*</span>
        </label>
        <input
          type="email"
          id="email"
          name="email"
          formControlName="email"
          inputmode="email"
          maxlength="255"
          autocomplete="email"
          class="form-input p-3 focus:border-brand focus:ring-1 focus:ring-brand outline-hidden transition-all"
          placeholder="Ej: juan@ejemplo.com"
        />
        <div class="min-h-8">
          <app-field-error
            [control]="formRegister.controls.email"
            [maxLength]="255"
            validLabel="Email disponible"
          />
        </div>
      </div>

      <div>
        <label for="password" class="mb-1.5 form-label font-semibold">
          Contraseña <span class="text-red-500">*</span>
        </label>

        <app-password-input
          [control]="formRegister.controls.password"
          inputId="password"
          describedBy="password-hint"
          fieldClass="rounded-lg border border-gray-300 shadow-sm focus-within:border-brand focus-within:ring-1 focus-within:ring-brand"
          inputClass="p-3 text-sm text-gray-900"
        />

        <app-password-rule-hint [control]="formRegister.controls.password" />
      </div>

      <div>
        <label for="confirmPassword" class="mb-1.5 form-label font-semibold">
          Confirmar Contraseña <span class="text-red-500">*</span>
        </label>

        <app-password-input
          [control]="formRegister.controls.confirmPassword"
          inputId="confirmPassword"
          placeholder="Repetí tu contraseña"
          fieldClass="rounded-lg border border-gray-300 shadow-sm focus-within:border-brand focus-within:ring-1 focus-within:ring-brand"
          inputClass="p-3 text-sm text-gray-900"
        />

        <div class="min-h-8">
          <app-field-error [control]="formRegister.controls.confirmPassword" />
        </div>
      </div>
    </div>

    <!-- Aceptación de los Términos y la Política de Privacidad (se abren en otra pestaña para no perder lo cargado) -->
    <div class="flex justify-center">
      <label
        for="acceptTerms"
        class="flex max-w-xl cursor-pointer items-start gap-2 text-sm text-gray-600"
      >
        <input
          type="checkbox"
          id="acceptTerms"
          name="acceptTerms"
          formControlName="acceptTerms"
          class="mt-0.5 h-4 w-4 shrink-0 cursor-pointer rounded border-gray-300 accent-brand"
        />
        <span>
          Leí y acepto los
          <a
            routerLink="/terminos"
            target="_blank"
            class="font-bold text-brand hover:underline"
            >Términos y Condiciones</a
          >
          y la
          <a
            routerLink="/privacidad"
            target="_blank"
            class="font-bold text-brand hover:underline"
            >Política de Privacidad</a
          >, incluida la transferencia de mis datos a proveedores ubicados fuera
          de la Argentina.
        </span>
      </label>
    </div>

    @if (turnstileEnabled) {
      <!-- Verificación anti-bots de Cloudflare Turnstile -->
      <app-turnstile (tokenChange)="turnstileToken.set($event)" />
    }

    <div class="pt-0 flex justify-center">
      <button
        type="submit"
        disabled
        [disabled]="loading() || !isValid() || isPending()"
        class="btn-primary w-full lg:w-72 flex justify-center py-3 px-4 shadow-md enabled:hover:shadow-lg focus:ring-2 focus:ring-offset-2 focus:ring-brand enabled:transform enabled:active:scale-[0.98] font-bold"
      >
        @if (loading()) {
          <ng-icon
            name="bootstrapArrowClockwise"
            class="animate-spin text-xl mr-2"
          ></ng-icon>
        }
        Crear Cuenta
      </button>
    </div>

    <div class="mt-4 text-center text-sm text-gray-600">
      ¿Ya tenés cuenta?
      <a
        routerLink="/auth/login"
        replaceUrl
        class="cursor-pointer inline-block py-1 font-bold text-brand hover:text-brand-hover hover:underline transition-colors ml-1"
      >
        Iniciar Sesión
      </a>
    </div>
  </form>
</app-auth-shell>
