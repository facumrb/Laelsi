<app-auth-shell
  layout="split"
  heading="Iniciar sesión - LaElsi"
  [backUrl]="backUrl()"
>
  <form
    [formGroup]="formLogin"
    novalidate
    (ngSubmit)="onSubmit()"
    class="space-y-3"
  >
    <div>
      <label for="username" class="mb-1.5 form-label font-semibold">
        Usuario o email
      </label>
      <input
        type="text"
        id="username"
        name="username"
        formControlName="username"
        minlength="4"
        maxlength="255"
        autocomplete="username"
        class="form-input p-3 focus:border-brand focus:ring-1 focus:ring-brand outline-hidden transition-all"
      />
      <div class="min-h-8 sm:min-h-0">
        <app-field-error [control]="formLogin.controls.username" />
      </div>
    </div>

    <div>
      <div
        class="mb-1.5 flex flex-wrap items-baseline justify-between gap-x-3 gap-y-1"
      >
        <label for="password" class="form-label mb-0 font-semibold">
          Contraseña
        </label>
        <a
          routerLink="/auth/recover-password"
          class="inline-block py-1 text-sm font-medium text-brand hover:underline sm:hidden"
        >
          ¿Olvidaste tu contraseña?
        </a>
      </div>

      <app-password-input
        [control]="formLogin.controls.password"
        inputId="password"
        placeholder=""
        autocomplete="current-password"
        fieldClass="rounded-lg border border-gray-300 shadow-sm focus-within:border-brand focus-within:ring-1 focus-within:ring-brand"
        inputClass="p-3 text-sm text-gray-900"
      />

      <!-- En pantallas chicas no entra junto al error: ahí el enlace va en la fila de la etiqueta -->
      <div class="mt-1 sm:flex sm:items-start sm:justify-between sm:gap-3">
        <div class="min-w-0 sm:flex-1">
          <app-field-error [control]="formLogin.controls.password" />
        </div>
        <a
          routerLink="/auth/recover-password"
          class="hidden shrink-0 py-1 mt-1 text-sm font-medium text-brand hover:underline sm:inline-block"
        >
          ¿Olvidaste tu contraseña?
        </a>
      </div>
    </div>

    <div class="pt-2">
      <button
        type="submit"
        [disabled]="loading()"
        class="btn-primary w-full flex justify-center py-3 px-4 shadow-md hover:shadow-lg focus:ring-2 focus:ring-offset-2 focus:ring-brand transform active:scale-[0.98] font-bold"
      >
        @if (loading()) {
          <ng-icon
            name="bootstrapArrowClockwise"
            class="animate-spin text-xl mr-2"
          ></ng-icon>
        }
        Iniciar Sesión
      </button>
    </div>

    <!-- Inicio de sesión con Google (Supabase Auth) -->
    <div class="flex items-center gap-3">
      <div class="grow border-t border-gray-200"></div>
      <span class="text-xs font-medium uppercase text-gray-400">o</span>
      <div class="grow border-t border-gray-200"></div>
    </div>

    <button
      type="button"
      (click)="loginWithGoogle()"
      [disabled]="loading()"
      class="cursor-pointer w-full flex items-center justify-center gap-2 py-3 px-4 rounded-lg border border-gray-300 bg-white font-semibold text-gray-700 shadow-sm hover:bg-gray-50 transition-colors focus:outline-hidden focus:ring-2 focus:ring-offset-2 focus:ring-brand"
    >
      <ng-icon name="bootstrapGoogle" class="text-lg"></ng-icon>
      Continuar con Google
    </button>

    <p class="text-center text-xs text-gray-500">
      La primera vez que entres con Google te vamos a pedir que aceptes los
      <a
        routerLink="/terminos"
        target="_blank"
        class="font-semibold text-brand hover:underline"
        >Términos y Condiciones</a
      >
      y la
      <a
        routerLink="/privacidad"
        target="_blank"
        class="font-semibold text-brand hover:underline"
        >Política de Privacidad</a
      >.
    </p>

    <div class="mt-6 text-center text-sm text-gray-600">
      ¿No tenés cuenta aún?
      <a
        routerLink="/auth/register"
        replaceUrl
        class="cursor-pointer inline-block py-1 font-bold text-brand hover:text-brand-hover hover:underline transition-colors ml-1"
      >
        Crear cuenta
      </a>
    </div>
  </form>
</app-auth-shell>
