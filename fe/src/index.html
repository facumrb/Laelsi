<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <title>Laelsi</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Librería y papelería Laelsi en Rosario. Impresiones, fotocopias, útiles escolares, artículos de oficina y sellos personalizados."
    />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Laelsi" />
    <meta
      property="og:title"
      content="Laelsi - Librería y Papelería en Rosario"
    />
    <meta
      property="og:description"
      content="Librería y papelería Laelsi en Rosario. Impresiones, fotocopias, útiles escolares, artículos de oficina y sellos personalizados."
    />
    <meta property="og:locale" content="es_AR" />

    <link rel="icon" type="image/x-icon" href="assets/Webp/L.webp" />

    <!-- ID 70 (rendimiento): abre la conexión (DNS + TLS) con la API y con las imágenes mientras se descarga el
         JavaScript, en vez de esperar a la primera petición. La API se llama con fetch y CORS (lleva crossorigin);
         las imágenes, con <img> sin CORS (no lleva). Los valores son los de environment.ts y los de vercel.json
         (connect-src e img-src); si cambian, cambiarlos acá también. -->
    <link rel="preconnect" href="https://vwtqkglkenogylkranzz.supabase.co" crossorigin />
    <link rel="preconnect" href="https://productos.laelsi.com.ar" />

    <!-- ID 70 (rendimiento): el logo del cartel de la portada es el elemento que mide el LCP, pero el navegador recién se
         entera de que existe cuando Angular dibuja la página, después de bajar y ejecutar el JavaScript. Con la precarga
         se baja al mismo tiempo que el JavaScript. Tiene que elegir el mismo archivo que el <img> de LogoComponent: por
         eso repite su srcset, y el ancho (sizes) es el del cartel (main-page: width=240). Sin prioridad alta a propósito:
         en las demás páginas el logo no es lo más grande y no debe competir con el JavaScript por el ancho de banda. -->
    <link
      rel="preload"
      as="image"
      href="assets/Webp/Logo.webp"
      imagesrcset="assets/Webp/Logo-500.webp 500w, assets/Webp/Logo.webp 996w"
      imagesizes="240px"
    />
  </head>
  <body>
    <app-root></app-root>

    <!-- Sin JavaScript la tienda no carga, pero los enlaces legales siguen a la vista de
         quien lee el HTML sin ejecutarlo (por ejemplo, los robots que verifica Google) -->
    <noscript>
      <p>
        Laelsi: librería y papelería en Rosario. Para usar la tienda necesitás
        activar JavaScript en tu navegador.
      </p>
      <p>
        <a href="/privacidad">Política de Privacidad</a> ·
        <a href="/terminos">Términos y Condiciones</a>
      </p>
    </noscript>
  </body>
</html>
